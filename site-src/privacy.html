<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta name="keywords" content="{{keywords}}">
<meta name="application-name" content="Sill Note">
<link rel="canonical" href="{{canonical}}">
{{hreflang}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sill Note">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="https://www.sillnote.store/img/og.png">
<meta property="og:locale" content="{{ogLocale}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{root}}img/favicon.png">
<link rel="stylesheet" href="{{root}}style.css">
{{jsonld}}
</head>
<body>

<nav class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="./"><img src="img/icon.png" alt="">Sill Note</a>
    <div class="nav-links">
      <a href="./" data-i18n="nav.home">Home</a>
      <a class="source-pill" href="https://github.com/adwatch1/sill" data-i18n-title="nav.sourceTip"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span data-i18n="nav.source">Source code</span></a>
      <a class="coffee-pill" href="https://buymeacoffee.com/stilless">☕ <span data-i18n="coffee">Buy me a coffee</span></a>
      <select class="lang" id="lang" aria-label="Language">{{langOptions}}</select>
    </div>
  </div>
</nav>

<main class="doc">
  <div class="wrap narrow">
    <h1 data-i18n="p.title">Privacy Policy</h1>
    <p class="date" data-i18n="p.updated"></p>
    <p data-i18n="p.intro"></p>
    <h2 data-i18n="p.shortH"></h2>
    <ul data-i18n="p.short"></ul>
    <h2 data-i18n="p.storedH"></h2>
    <p data-i18n="p.stored"></p>
    <h2 data-i18n="p.ytH"></h2>
    <p data-i18n="p.yt"></p>
    <h2 data-i18n="p.micH"></h2>
    <p data-i18n="p.mic"></p>
    <h2 data-i18n="p.donH"></h2>
    <p data-i18n="p.don"></p>
    <h2 data-i18n="p.kidsH"></h2>
    <p data-i18n="p.kids"></p>
    <h2 data-i18n="p.changesH"></h2>
    <p data-i18n="p.changes"></p>
    <h2 data-i18n="p.contactH"></h2>
    <p data-i18n="p.contact"></p>
  </div>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <span>© 2026 stilless · Sill Note</span>
    <span class="links"><a href="./">Sill Note</a><a href="mailto:mailatikleri@gmail.com">mailatikleri@gmail.com</a></span>
  </div>
</footer>

<script src="{{root}}lang.js"></script>
</body>
</html>
